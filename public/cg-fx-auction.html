<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG — Auction SOLD</title>
<!--
  单块动画文件:拍卖落槌 SOLD!。自包含,被显示即自动播一遍后透明。
  OBS:来源 ➕ → 浏览器 → 勾「本地文件」→ 选此文件;1920×1080;
  勾「源不可见时关闭」。
-->
<style>
  :root { --gold:#F6C544; --ink:#1a1205; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .call { text-align:center; font-size:13vmin; font-weight:900; color:#fff;
    -webkit-text-stroke:.6vmin var(--ink); paint-order:stroke fill;
    text-shadow:0 0 5vmin rgba(246,197,68,.7), 0 1.5vmin 3vmin rgba(0,0,0,.6);
    transform:scale(0); animation:pop .45s cubic-bezier(.2,1.7,.4,1) forwards; }
  .call .gv { font-size:15vmin; display:block; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .confetti { position:fixed; top:-8vmin; width:1.4vmin; height:2.4vmin; border-radius:.3vmin; }
  #stage.out { animation:fade .5s ease forwards; }
  @keyframes fade { to{opacity:0} }
</style>
</head>
<body>
  <div id="stage"></div>
  <script>
  (function(){
    var stage=document.getElementById('stage');
    var GOLD=['#F6C544','#FFF0B8','#E0A92E','#FFFFFF','#FFD56A'];
    function confetti(n){
      for(var i=0;i<n;i++){
        var c=document.createElement('div'); c.className='confetti';
        c.style.left=(Math.random()*100)+'vw'; c.style.background=GOLD[(Math.random()*GOLD.length)|0];
        var dur=2.2+Math.random()*1.8, delay=Math.random()*0.5, drift=(Math.random()*2-1)*18, rot=Math.random()*720;
        document.body.appendChild(c);
        c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+drift+'vw,112vh) rotate('+rot+'deg)',opacity:1}],
          {duration:dur*1000,delay:delay*1000,easing:'cubic-bezier(.3,.1,.5,1)',fill:'forwards'});
        (function(el,t){setTimeout(function(){el.remove();},t*1000+200);})(c,dur+delay);
      }
    }
    var t1,t2;
    function play(){
      clearTimeout(t1); clearTimeout(t2);
      stage.classList.remove('out');
      stage.innerHTML='<div class="call"><span class="gv">✅</span>SOLD!</div>';
      confetti(80);
      t1=setTimeout(function(){ stage.classList.add('out'); },3000);
      t2=setTimeout(function(){ stage.innerHTML=''; stage.classList.remove('out'); },3500);
    }
    play();
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') play(); });
  })();
  </script>
</body>
</html>
