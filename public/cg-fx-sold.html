<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG — SOLD</title>
<!--
  ============================================================================
  单块动画文件:SOLD 成交 (放进 OBS,Stream Deck 触发)
  ============================================================================
  自包含:不连网、不连 Supabase、无外部依赖。被 OBS 显示出来就自动播一遍,
  播完自动透明。Stream Deck 让这个源"显示"一次 = 播一次。
  OBS 加法:来源 ➕ → 浏览器 → 勾「本地文件」→ 选这个文件;宽 1920 高 1080;
  勾「源不可见时关闭 / Shutdown source when not visible」。
  ============================================================================
-->
<style>
  :root { --gold:#F6C544; --gold-deep:#E0A92E; --gold-light:#FFF0B8; --ink:#1a1205; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .ring { position:absolute; top:42%; left:50%; width:18vmin; height:18vmin; margin:-9vmin 0 0 -9vmin;
    border:1vmin solid var(--gold); border-radius:50%; animation:ringOut .9s ease-out forwards; }
  @keyframes ringOut { from{transform:scale(.3);opacity:.9} to{transform:scale(4.2);opacity:0} }
  .stamp { font-weight:900; font-size:24vmin; letter-spacing:.5vmin; color:var(--gold);
    -webkit-text-stroke:.8vmin var(--ink); paint-order:stroke fill;
    text-shadow:0 .9vmin 0 var(--gold-deep), 0 2vmin 5vmin rgba(0,0,0,.55);
    transform:rotate(-9deg) scale(0); animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes stampIn { 0%{transform:rotate(-9deg) scale(3);opacity:0} 60%{transform:rotate(-9deg) scale(.86);opacity:1} 80%{transform:rotate(-9deg) scale(1.06)} 100%{transform:rotate(-9deg) scale(1)} }
  .confetti { position:fixed; top:-8vmin; width:1.4vmin; height:2.4vmin; border-radius:.3vmin; }
  #stage.out { animation:fade .5s ease forwards; }
  @keyframes fade { to{opacity:0} }
</style>
</head>
<body>
  <div id="stage"></div>
  <script>
  (function(){
    var stage=document.getElementById('stage');
    var GOLD=['#F6C544','#FFF0B8','#E0A92E','#FFFFFF','#FFD56A'];
    function confetti(n){
      for(var i=0;i<n;i++){
        var c=document.createElement('div'); c.className='confetti';
        c.style.left=(Math.random()*100)+'vw'; c.style.background=GOLD[(Math.random()*GOLD.length)|0];
        var dur=2.2+Math.random()*1.8, delay=Math.random()*0.5, drift=(Math.random()*2-1)*18, rot=Math.random()*720;
        document.body.appendChild(c);
        c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+drift+'vw,112vh) rotate('+rot+'deg)',opacity:1}],
          {duration:dur*1000,delay:delay*1000,easing:'cubic-bezier(.3,.1,.5,1)',fill:'forwards'});
        (function(el,t){setTimeout(function(){el.remove();},t*1000+200);})(c,dur+delay);
      }
    }
    var t1,t2;
    function play(){
      clearTimeout(t1); clearTimeout(t2);
      stage.classList.remove('out');
      stage.innerHTML='<div class="ring"></div><div class="stamp">SOLD</div>';
      confetti(80);
      t1=setTimeout(function(){ stage.classList.add('out'); },3600);
      t2=setTimeout(function(){ stage.innerHTML=''; stage.classList.remove('out'); },4200);
    }
    play();
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') play(); });
  })();
  </script>
</body>
</html>
