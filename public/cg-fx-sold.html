<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG — SOLD (premium)</title>
<!--
  单块动画:SOLD 成交(高质感版)。自包含,无外部依赖,透明背景。
  金箔流光 SOLD 印章砸入 + 光爆冲击 + Canvas 金币/火花/彩带喷射。
  被 OBS 显示即自动播一遍后透明;visibilitychange 再次显示会重播。
  OBS:来源 ➕ → 浏览器 → 本地文件/网址;1920×1080;勾「源不可见时关闭」。
-->
<style>
  :root { --gold:#F6C544; --gold-deep:#C8881B; --gold-light:#FFF3C4; --ink:#140d02; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:"Arial Black",system-ui,-apple-system,sans-serif; }

  .glow { position:fixed; left:50%; top:50%; width:110vmin; height:110vmin; transform:translate(-50%,-50%) scale(.4);
    background:radial-gradient(circle, rgba(246,197,68,.5) 0%, rgba(246,197,68,.16) 32%, transparent 62%);
    filter:blur(8px); opacity:0; animation:glowIn .9s ease-out forwards; }
  @keyframes glowIn { 0%{opacity:0;transform:translate(-50%,-50%) scale(.4)} 45%{opacity:1} 100%{opacity:.8;transform:translate(-50%,-50%) scale(1)} }

  .shock { position:fixed; left:50%; top:50%; width:28vmin; height:28vmin; margin:-14vmin 0 0 -14vmin;
    border:1.4vmin solid rgba(255,243,196,.92); border-radius:50%; filter:blur(.3vmin);
    animation:shock .95s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes shock { 0%{transform:scale(.2);opacity:1} 100%{transform:scale(5);opacity:0} }
  .flash { position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.85), rgba(255,236,170,.3) 26%, transparent 56%);
    animation:flash .5s ease-out forwards; }
  @keyframes flash { 0%{opacity:0} 14%{opacity:1} 100%{opacity:0} }

  canvas#fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }

  .stamp { position:relative; z-index:5; font-size:23vmin; font-weight:900; letter-spacing:.6vmin;
    background:linear-gradient(96deg, #9a6708 0%, #F6C544 22%, #FFF7D4 46%, #FFFFFF 50%, #FFF7D4 54%, #F6C544 74%, #a9740c 100%);
    background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 4vmin rgba(246,197,68,.55), 0 0 9vmin rgba(246,197,68,.3);
    filter:drop-shadow(0 1vmin .2vmin rgba(0,0,0,.55)) drop-shadow(0 0 1.2vmin rgba(255,220,120,.6));
    transform:rotate(-8deg) scale(0); animation:slam .55s cubic-bezier(.2,1.5,.4,1) forwards, sheen 2.4s linear .35s infinite; }
  @keyframes slam { 0%{transform:rotate(-8deg) scale(3);opacity:0} 55%{transform:rotate(-8deg) scale(.86);opacity:1} 78%{transform:rotate(-8deg) scale(1.07)} 100%{transform:rotate(-8deg) scale(1)} }
  @keyframes sheen { 0%{background-position:130% 0} 100%{background-position:-130% 0} }

  #wrap.out { animation:fade .55s ease forwards; }
  @keyframes fade { to{opacity:0} }
</style>
</head>
<body>
  <div id="wrap">
    <div class="glow"></div>
    <canvas id="fx"></canvas>
    <div class="stamp">SOLD</div>
  </div>

  <script>
  (function(){
    var wrap=document.getElementById('wrap');
    var cv=document.getElementById('fx'), ctx=cv.getContext('2d');
    var W,H,DPR=Math.min(window.devicePixelRatio||1,2);
    function size(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
    size(); addEventListener('resize',size);

    var GOLD=['#FFE9A8','#F6C544','#FFD56A','#FFFFFF','#E0A92E'];
    var pick=function(a){ return a[(Math.random()*a.length)|0]; };
    var parts=[], raf=null, t1=null, t2=null;

    function burst(){
      var cx=W/2, cy=H*0.47;
      // 火花喷射
      for(var i=0;i<120;i++){
        var a=Math.random()*Math.PI*2, sp=(4+Math.random()*12)*DPR;
        parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.06*DPR,drag:0.95,
          r:(1+Math.random()*2.2)*DPR,life:1,decay:0.013+Math.random()*0.02,c:pick(GOLD),add:true});
      }
      // 金币(成交主题)— 实心金圆带暗边,向上弹再落下
      for(var n=0;n<26;n++){
        var a2=(-Math.PI/2)+(Math.random()*1.6-0.8), sp2=(7+Math.random()*9)*DPR;
        parts.push({x:cx,y:cy,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,g:0.28*DPR,drag:1,
          rad:(7+Math.random()*7)*DPR,phase:Math.random()*6.28,vr:0.2+Math.random()*0.2,
          life:1,decay:0.006+Math.random()*0.005,coin:true});
      }
      // 金箔彩带
      for(var k=0;k<60;k++){
        parts.push({x:Math.random()*W,y:-Math.random()*H*0.3,vx:(Math.random()*2-1)*1.2*DPR,vy:(2+Math.random()*3)*DPR,g:0.06*DPR,drag:1,
          w:(3+Math.random()*4)*DPR,h:(7+Math.random()*8)*DPR,rot:Math.random()*6.28,vr:(Math.random()*2-1)*0.3,
          life:1,decay:0.003+Math.random()*0.004,c:pick(GOLD),flake:true});
      }
    }

    function frame(){
      ctx.clearRect(0,0,W,H);
      for(var i=parts.length-1;i>=0;i--){
        var p=parts[i];
        p.vx*=p.drag; p.vy=p.vy*p.drag+p.g; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
        if(p.life<=0||p.y>H+50){ parts.splice(i,1); continue; }
        var al=Math.max(0,Math.min(1,p.life));
        if(p.coin){
          p.phase+=p.vr;
          var sx=Math.abs(Math.cos(p.phase)); // 翻转:横向压扁模拟硬币转
          ctx.save(); ctx.globalAlpha=al; ctx.translate(p.x,p.y); ctx.scale(sx*0.85+0.15,1);
          var g=ctx.createRadialGradient(-p.rad*0.3,-p.rad*0.3,1,0,0,p.rad);
          g.addColorStop(0,'#FFF3C4'); g.addColorStop(.5,'#F6C544'); g.addColorStop(1,'#C8881B');
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,p.rad,0,6.283); ctx.fill();
          ctx.lineWidth=Math.max(1,p.rad*0.12); ctx.strokeStyle='rgba(120,80,10,.7)'; ctx.stroke();
          ctx.restore();
        } else if(p.flake){
          p.rot+=p.vr;
          ctx.save(); ctx.globalAlpha=al; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.5+0.5*Math.abs(Math.cos(p.rot)))); ctx.restore();
        } else {
          ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=al;
          ctx.beginPath(); ctx.fillStyle=p.c; ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
          ctx.globalCompositeOperation='source-over';
        }
      }
      ctx.globalAlpha=1;
      raf=requestAnimationFrame(frame);
    }

    function transient(cls,ms){ var d=document.createElement('div'); d.className=cls; wrap.appendChild(d); setTimeout(function(){ d.remove(); },ms); }
    function play(){
      clearTimeout(t1); clearTimeout(t2); if(raf) cancelAnimationFrame(raf);
      wrap.classList.remove('out'); parts=[];
      transient('flash',550); transient('shock',950);
      burst(); raf=requestAnimationFrame(frame);
      t1=setTimeout(function(){ wrap.classList.add('out'); },3700);
      t2=setTimeout(function(){ if(raf) cancelAnimationFrame(raf); parts=[]; ctx.clearRect(0,0,W,H); },4300);
    }
    play();
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') play(); });
  })();
  </script>
</body>
</html>
